{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="max-w-md mx-auto bg-white border border-gray-200 rounded-lg p-6">
    <h1 class="text-xl font-bold text-gray-900">Create your organization</h1>
    <form method="post" class="mt-4">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="mt-4 w-full bg-indigo-600 text-white px-4 py-2 rounded-md">Create</button>
    </form>
</div>
{% endblock %}
